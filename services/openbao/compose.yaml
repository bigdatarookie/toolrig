services:
  openbao:
    image: docker.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["server", "-config=/openbao/config/server.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "${TOOLRIG_OPENBAO_BIND:-127.0.0.1}:${TOOLRIG_OPENBAO_PORT:-8200}:8200"
    volumes:
      - data:/openbao/file
      - ./config/server.hcl:/openbao/config/server.hcl:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200", "-format=json"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      org.openrig.project: toolrig
      org.openrig.service: openbao
      org.openrig.owner: infrastructure.secrets

volumes:
  data:
