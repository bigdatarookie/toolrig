name: Tool Hub
on: [push, pull_request]
jobs:
  availability:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
