# Toolrig v0.1: user-authorized launch; service migrations remain separately scoped.
version: "0.2"
name: toolrig
summary: Shared tool hub and host infrastructure; launch authorized
culture_file: CULTURE.md
permission_policy: builtin:yolo
env:
  CODEX_HOME: /Users/garry/.codex-opentour
workspace:
  workspace_root: .
  repos:
    - name: toolrig
      path: .
      kind: project
  default_repo: toolrig
startup:
