[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "toolrig-documents"
version = "0.1.0"
description = "Bounded read-only document inspection, extraction, rendering, and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "defusedxml==0.7.1",
  "mcp==2.3.0",
  "openpyxl==3.1.5",
  "pdfminer.six==20260107",
  "pdfplumber==0.11.10",
  "Pillow==13.0.0",
  "pytesseract==0.3.13",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "reportlab==5.1.0",
]

[project.scripts]
toolrig-documents = "toolrig_documents.cli:main"
toolrig-documents-mcp = "toolrig_documents.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toolrig_documents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
